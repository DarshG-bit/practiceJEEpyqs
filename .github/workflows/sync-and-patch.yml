name: Daily Sync and Auto-Patch

on:
  schedule:
    # Runs everyday at 04:00 UTC (09:30 AM IST)
    - cron: '0 4 * * *'
  workflow_dispatch:
    # Allows you to trigger the sync manually anytime with 1 click from the Actions tab

permissions:
  contents: write

jobs:
  sync-and-patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Fork Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch Latest Files from Creator (rupinderiitb)
        run: |
          git remote add upstream https://github.com/rupinderiitb/practicemakesperfect.git 2>/dev/null || true
          git fetch upstream main
          # Cleanly pull updated chapters and questions from upstream
          git checkout upstream/main -- Chemistry Maths Physics index.html 2>/dev/null || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run 1-Step Automated Patcher
        run: |
          python patch_all.py

      - name: Commit and Push Patched Files
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "No changes detected. Repository is already up-to-date."
          else
            git commit -m "chore: sync latest questions from creator and auto-patch [skip ci]"
            git push origin main
          fi
